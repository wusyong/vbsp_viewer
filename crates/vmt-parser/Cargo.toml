[package]
name = "vmt-parser"
version = "0.2.1"
edition = "2024"
description = "Rust parser for valve vmt files."
license = "MIT"
repository = "https://codeberg.org/icewind/vmt-parser"
rust-version = "1.86.0"

[dependencies]
thiserror = "2.0.18"
miette = "7.6.0"
vdf-reader = "0.3.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_repr = "0.1.20"

[dev-dependencies]
test-case = "3.3.1"
insta = { version = "1.48.0", features = ["json"] }
miette = { version = "7.6.0", features = ["fancy"] }
walkdir = "2.5.0"
