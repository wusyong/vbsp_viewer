[workspace]
resolver = "3"
members = [
    "crates/bsp",
]

[workspace.dependencies]
bytemuck  = { version = "1", features = ["derive"] }
memmap2   = "0.9"
lzma-rs   = "0.3"
thiserror = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[package]
name = "bevy-tf2"
version = "0.1.0"
edition = "2024"

[dependencies]
