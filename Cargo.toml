[workspace]
resolver = "3"
members = [
    "crates/tf2-bevy-viewer",

    # Vendored -- see crates/VENDORING.md for upstream URLs, pinned revisions,
    # and the (manifest-only) changes made to each.
    "crates/vbsp",
    "crates/vbsp/common",
    "crates/qbsp",
    "crates/qbsp/qbsp_macros",
    "crates/qbsp/tools/write-lightmaps",
    "crates/vmt-parser",
]

# The vendored crates carry binaries of their own (qbsp's write-lightmaps), so
# without this a bare `cargo run` at the root is ambiguous. Default to the only
# thing anyone here actually wants to run; the rest still build as dependencies.
default-members = ["crates/tf2-bevy-viewer"]

# Debug builds of the viewer are unusable at opt-level 0 -- a 20 MB BSP takes
# tens of seconds to parse. Level 1 on our own code keeps compiles quick while
# staying debuggable; level 3 on dependencies is a one-off cost paid once.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
